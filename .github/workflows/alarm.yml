name: Morning Stock Briefing

on:
  schedule:
    # 한국 시간(KST) 평일(월~금) 오전 8시에 실행 (UTC 기준 전날 23시)
    - cron: '0 23 * * 0-4'
  workflow_dispatch:

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests pandas yfinance pytz
      - name: Run alert script
        run: python auto_alert.py
